default_install_hook_types: ["pre-commit"]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: max-lines
        name: max 600 lines
        entry: >-
          python -c "import sys; bad = [f'{p}: {n} lines (max 600)' for p in sys.argv[1:] if (n := sum(1 for _ in open(p, 'rb'))) > 600]; print(*bad, sep=chr(10)); sys.exit(bool(bad))"
        language: python
        types: [python]
        exclude: ^tests/
      - id: no-data-files
        name: no data, keys or wallet files
        entry: Data or key files must not be committed
        language: fail
        files: (?i)(\.(csv|json|sql|db|sqlite3?|key|pem)$|(^|/)\.env$|keystore)
        exclude: ^\.github/
