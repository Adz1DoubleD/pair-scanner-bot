[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-scanner-bot"
version = "1.8.0"
description = "Self-hosted Telegram bot that watches new token pairs, audits them and can trade them from your own wallet."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adz1DoubleD" }]
keywords = ["telegram", "bot", "ethereum", "base", "uniswap", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot[job-queue]>=22,<23",
    "aiomysql[rsa]>=0.3,<0.4",
    "sentry-sdk>=2,<3",
    "web3>=8,<9",
    "aiohttp>=3.9,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "freezegun==1.5.5",
    "mypy==2.4.1",
    "ruff==0.17.5",
    "pre_commit==4.7.0",
]

[project.urls]
Homepage = "https://github.com/Adz1DoubleD/pair-scanner-bot"
Issues = "https://github.com/Adz1DoubleD/pair-scanner-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pair_scanner*"]

[tool.setuptools.package-data]
pair_scanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = ["union-attr"]
